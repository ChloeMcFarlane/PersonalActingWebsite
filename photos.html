         <!-- Image focus Functionality -->

        <script>
          document.addEventListener('DOMContentLoaded', function() {
            const viewButtons = document.querySelectorAll('.btn');
            const closeButtons = document.querySelectorAll('.close');
            
            viewButtons.forEach(button => {
              button.addEventListener('click', function() {
          const project = this.closest('.project');
          const overlay = project.querySelector('.overlay');
          overlay.style.display = 'flex'; // Show overlay
          overlay.style.opacity = '0'; // Start with hidden overlay
          setTimeout(() => {
            overlay.style.transition = 'opacity 0.5s'; // Transition effect
            overlay.style.opacity = '1'; // Fade in
          }, 10);
              });
            });

            closeButtons.forEach(button => {
              button.addEventListener('click', function() {
          const overlay = this.closest('.overlay');
          overlay.style.opacity = '0'; // Fade out
          setTimeout(() => {
            overlay.style.display = 'none'; // Hide overlay after fade out
          }, 500); // Match the duration of the fade
              });
            });
          });
        </script>
